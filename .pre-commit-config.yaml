# Pre-commit hooks for Soup CLI.
#
#   Install once:   pip install pre-commit && pre-commit install
#   Run on staged:  pre-commit run
#   Run everything: pre-commit run --all-files
#
# NOTE: `ruff format` has never been run across this codebase, so the FIRST
# `pre-commit run --all-files` will reformat MANY files. That one-time churn is
# expected. Normal commits only run the hooks against staged files, so day-to-
# day use is non-invasive.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Validates .github/workflows/*.yml against the GitHub Actions schema —
  # context availability, expression syntax, action inputs, shellcheck over
  # `run:` blocks. `check-yaml` below cannot see any of that: a workflow can be
  # perfectly valid YAML and still be rejected by GitHub before a single job
  # starts, which is exactly what happened in 195d60b.
  #
  # Builds with Go. If a contributor has no Go toolchain, swap this for the
  # `actionlint-docker` id from the same repo.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
